<!DOCTYPE html>
<html lang="sv">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Tr&#228;ffas.se &#8212; Snart h&#228;r</title>
<style>
  /* Custom font */
  @font-face {
    font-family: 'DreamingOutloud';
    src: url('fonts/dreaming-outloud-pro-regular.otf') format('opentype');
    font-weight: normal;
    font-style: normal;
  }

  /* Design tokens */
  :root {
    --bg:               #111111;
    --bg-glow:          rgba(106, 76, 147, 0.22);
    --logo-from:        #FFFFFF;
    --logo-to:          #8B5FC2;
    --phrase-color:     rgba(255, 255, 255, 0.82);
  }

  /* Light mode overrides */
  @media (prefers-color-scheme: light) {
    :root {
      --bg:               #F3EEFF;
      --bg-glow:          rgba(106, 76, 147, 0.13);
      --logo-from:        #1E1228;
      --logo-to:          #6A4C93;
      --phrase-color:     #3B2850;
    }
  }

  *, *::before, *::after { margin: 0; padding: 0; box-sizing: border-box; }

  html { height: 100%; }

  body {
    min-height: 100vh;
    background: var(--bg);
    font-family: Georgia, serif;
    color: var(--phrase-color);
    overflow: hidden;
    display: flex;
    flex-direction: column;
    align-items: center;
    justify-content: center;
    transition: background 0.4s, color 0.4s;
  }

  body::before {
    content: '';
    position: fixed;
    top: 30%; left: 50%;
    transform: translate(-50%, -50%);
    width: min(700px, 90vw);
    height: min(700px, 90vw);
    background: radial-gradient(ellipse, var(--bg-glow) 0%, transparent 68%);
    pointer-events: none;
    z-index: 0;
  }

  canvas {
    position: fixed;
    inset: 0;
    z-index: 0;
    pointer-events: none;
  }

  .content {
    position: relative;
    z-index: 1;
    text-align: center;
    max-width: 700px;
    padding: 2rem;
  }

  .logo {
    font-family: Georgia, serif;
    font-size: clamp(2.6rem, 6vw, 4.2rem);
    font-weight: bold;
    letter-spacing: 0.04em;
    line-height: 1;
    background: linear-gradient(135deg, var(--logo-from) 35%, var(--logo-to));
    -webkit-background-clip: text;
    -webkit-text-fill-color: transparent;
    background-clip: text;
    margin-bottom: 2.5rem;
    opacity: 0;
    animation: fadeUp 1s ease 0.3s forwards;
  }

  .phrase-wrap {
    min-height: 3rem;
    display: flex;
    align-items: center;
    justify-content: center;
    margin-bottom: 2.4rem;
  }

  .phrase {
    font-family: Georgia, serif;
    font-size: clamp(1.2rem, 3vw, 1.6rem);
    font-style: italic;
    font-weight: normal;
    color: var(--phrase-color);
    letter-spacing: 0.03em;
    opacity: 0;
    transition: color 0.4s;
  }

  @keyframes fadeUp {
    from { opacity: 0; transform: translateY(18px); }
    to   { opacity: 1; transform: translateY(0); }
  }
</style>
</head>
<body>
<canvas id="c"></canvas>

<div class="content">
  <div class="logo">Tr&#228;ffas</div>

  <div class="phrase-wrap">
    <p class="phrase" id="phrase"></p>
  </div>

</div>

<script>
// Pulsing phrase cycle — text swaps at the bottom of each blink
const PHRASES  = [
  'K\u00e4rlek b\u00f6rjar med ett m\u00f6te',
  'Hitta din match \u2014 2026',
];
const CYCLE_MS = 3200; // duration of one full blink

const phraseEl = document.getElementById('phrase');
let phraseIndex = 0;
let pStart = null;

function pulse(ts) {
  if (!pStart) pStart = ts;
  const t = ((ts - pStart) % CYCLE_MS) / CYCLE_MS;
  // Cosine wave: bright at t=0 & t=1, dark at t=0.5
  phraseEl.style.opacity = 0.5 + 0.38 * Math.cos(2 * Math.PI * t);
  requestAnimationFrame(pulse);
}

setTimeout(() => {
  phraseEl.textContent = PHRASES[phraseIndex];
  requestAnimationFrame(pulse);

  // Swap text at each trough (half-cycle), then every full cycle
  setTimeout(function swapText() {
    phraseIndex = (phraseIndex + 1) % PHRASES.length;
    phraseEl.textContent = PHRASES[phraseIndex];
    setTimeout(swapText, CYCLE_MS);
  }, CYCLE_MS / 2);
}, 800);

const canvas = document.getElementById('c');
const ctx    = canvas.getContext('2d');
let W, H, particles = [];

function isLight() {
  return window.matchMedia('(prefers-color-scheme: light)').matches;
}

function heartColor() {
  const h = 265 + Math.random() * 20;
  return isLight()
    ? 'hsl(' + h + ', 55%, 52%)'
    : 'hsl(' + h + ', 45%, 60%)';
}

function maxAlpha() {
  return isLight() ? 0.18 : 0.30;
}

function resize() {
  W = canvas.width  = window.innerWidth;
  H = canvas.height = window.innerHeight;
}
resize();
window.addEventListener('resize', resize);

function randomHeart() {
  return {
    x:           Math.random() * W,
    y:           H + 20,
    size:        6 + Math.random() * 14,
    speed:       0.4 + Math.random() * 0.8,
    alpha:       0.06 + Math.random() * maxAlpha(),
    drift:       (Math.random() - 0.5) * 0.4,
    wobble:      Math.random() * Math.PI * 2,
    wobbleSpeed: 0.01 + Math.random() * 0.02,
  };
}

for (let i = 0; i < 40; i++) {
  const p = randomHeart();
  p.y = Math.random() * H;
  particles.push(p);
}

function drawHeart(x, y, size, alpha) {
  ctx.save();
  ctx.globalAlpha = alpha;
  ctx.fillStyle   = heartColor();
  ctx.beginPath();
  const s = size * 0.5;
  ctx.moveTo(x, y + s * 0.5);
  ctx.bezierCurveTo(x, y,               x - s, y,           x - s, y - s * 0.5);
  ctx.bezierCurveTo(x - s, y - s * 1.2, x,     y - s * 1.2, x,     y - s * 0.5);
  ctx.bezierCurveTo(x,     y - s * 1.2, x + s, y - s * 1.2, x + s, y - s * 0.5);
  ctx.bezierCurveTo(x + s, y,           x,     y,            x,     y + s * 0.5);
  ctx.fill();
  ctx.restore();
}

function animate() {
  ctx.clearRect(0, 0, W, H);
  for (const p of particles) {
    p.y      -= p.speed;
    p.wobble += p.wobbleSpeed;
    p.x      += p.drift + Math.sin(p.wobble) * 0.3;
    drawHeart(p.x, p.y, p.size, p.alpha);
    if (p.y < -30) Object.assign(p, randomHeart());
  }
  requestAnimationFrame(animate);
}
animate();

window.matchMedia('(prefers-color-scheme: light)').addEventListener('change', () => {
  particles.forEach(p => { p.alpha = 0.06 + Math.random() * maxAlpha(); });
});
</script>
</body>
</html>
