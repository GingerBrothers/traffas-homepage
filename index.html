<!DOCTYPE html>
<html lang="sv">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Träffas.se — Snart här</title>
<style>
  * { margin: 0; padding: 0; box-sizing: border-box; }

  body {
    min-height: 100vh;
    background: #1a0f2e;
    font-family: 'Georgia', serif;
    color: #fff;
    overflow: hidden;
    display: flex;
    flex-direction: column;
    align-items: center;
    justify-content: center;
  }

  canvas {
    position: fixed;
    inset: 0;
    z-index: 0;
    pointer-events: none;
  }

  .content {
    position: relative;
    z-index: 1;
    text-align: center;
    max-width: 700px;
    padding: 2rem;
  }

  .logo {
    font-size: 1rem;
    letter-spacing: 0.4em;
    text-transform: uppercase;
    color: #A58BC4;
    margin-bottom: 2.5rem;
    opacity: 0;
    animation: fadeUp 1s ease 0.3s forwards;
  }

  h1 {
    font-size: clamp(2.5rem, 6vw, 4.5rem);
    font-weight: 400;
    line-height: 1.15;
    background: linear-gradient(135deg, #fff 30%, #8B6DB8);
    -webkit-background-clip: text;
    -webkit-text-fill-color: transparent;
    background-clip: text;
    opacity: 0;
    animation: fadeUp 1s ease 0.6s forwards;
    margin-bottom: 1rem;
  }

  .sub {
    font-size: 1.1rem;
    color: rgba(255,255,255,0.55);
    font-style: italic;
    opacity: 0;
    animation: fadeUp 1s ease 0.9s forwards;
    margin-bottom: 3rem;
  }

  .year {
    font-size: clamp(3rem, 10vw, 7rem);
    font-weight: 700;
    font-family: 'Courier New', monospace;
    background: linear-gradient(180deg, #fff, #6A4C93);
    -webkit-background-clip: text;
    -webkit-text-fill-color: transparent;
    background-clip: text;
    margin-bottom: 3rem;
    opacity: 0;
    animation: fadeUp 1s ease 1.2s forwards;
  }

  .tagline {
    margin-top: 2rem;
    font-size: 0.78rem;
    color: rgba(255,255,255,0.25);
    letter-spacing: 0.05em;
    opacity: 0;
    animation: fadeUp 1s ease 1.8s forwards;
  }

  @keyframes fadeUp {
    from { opacity: 0; transform: translateY(20px); }
    to   { opacity: 1; transform: translateY(0); }
  }
</style>
</head>
<body>
<canvas id="c"></canvas>

<div class="content">
  <div class="logo">Träffas.se</div>
  <h1>Kärlek börjar<br>med ett möte</h1>
  <p class="sub">En ny dejtingupplevelse öppnar snart sina dörrar.</p>

  <div class="year">2026</div>

</div>

<script>
// Particle canvas
const canvas = document.getElementById('c');
const ctx = canvas.getContext('2d');
let W, H, particles = [];

function resize() {
  W = canvas.width  = window.innerWidth;
  H = canvas.height = window.innerHeight;
}
resize();
window.addEventListener('resize', resize);

function randomHeart() {
  return {
    x: Math.random() * W,
    y: H + 20,
    size: 6 + Math.random() * 14,
    speed: 0.4 + Math.random() * 0.8,
    alpha: 0.1 + Math.random() * 0.35,
    drift: (Math.random() - 0.5) * 0.4,
    wobble: Math.random() * Math.PI * 2,
    wobbleSpeed: 0.01 + Math.random() * 0.02,
  };
}

for (let i = 0; i < 40; i++) {
  const p = randomHeart();
  p.y = Math.random() * H;
  particles.push(p);
}

function drawHeart(ctx, x, y, size, alpha) {
  ctx.save();
  ctx.globalAlpha = alpha;
  ctx.fillStyle = `hsl(${265 + Math.random()*20}, 45%, 60%)`;  // amethyst
  ctx.beginPath();
  const s = size * 0.5;
  ctx.moveTo(x, y + s * 0.5);
  ctx.bezierCurveTo(x, y, x - s, y, x - s, y - s * 0.5);
  ctx.bezierCurveTo(x - s, y - s * 1.2, x, y - s * 1.2, x, y - s * 0.5);
  ctx.bezierCurveTo(x, y - s * 1.2, x + s, y - s * 1.2, x + s, y - s * 0.5);
  ctx.bezierCurveTo(x + s, y, x, y, x, y + s * 0.5);
  ctx.fill();
  ctx.restore();
}

function animate() {
  ctx.clearRect(0, 0, W, H);
  for (let p of particles) {
    p.y -= p.speed;
    p.wobble += p.wobbleSpeed;
    p.x += p.drift + Math.sin(p.wobble) * 0.3;
    drawHeart(ctx, p.x, p.y, p.size, p.alpha);
    if (p.y < -30) Object.assign(p, randomHeart());
  }
  requestAnimationFrame(animate);
}
animate();
</script>
</body>
</html>
