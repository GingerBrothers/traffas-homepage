<!DOCTYPE html>
<html lang="sv">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Traffas - Snart har</title>
<style>
  @font-face {
    font-family: 'DreamingOutloud';
    src: url('fonts/dreaming-outloud-pro-regular.otf') format('opentype');
    font-weight: normal;
    font-style: normal;
  }

  * { margin: 0; padding: 0; box-sizing: border-box; }

  body {
    min-height: 100vh;
    background: #1a0f2e;
    font-family: 'DreamingOutloud', Georgia, serif;
    color: #fff;
    overflow: hidden;
    display: flex;
    flex-direction: column;
    align-items: center;
    justify-content: center;
  }

  canvas {
    position: fixed;
    inset: 0;
    z-index: 0;
    pointer-events: none;
  }

  .content {
    position: relative;
    z-index: 1;
    text-align: center;
    max-width: 700px;
    padding: 2rem;
  }

  .logo {
    font-family: 'DreamingOutloud', Georgia, serif;
    font-size: 3.2rem;
    font-weight: normal;
    font-style: normal;
    letter-spacing: 0.06em;
    color: rgba(255,255,255,0.15);
    text-shadow: 0 0 1px #A58BC4;
    margin-bottom: 2.5rem;
    opacity: 0;
    animation: fadeUp 1s ease 0.3s forwards;
  }

  .typewriter-wrap {
    min-height: 3rem;
    display: flex;
    align-items: center;
    justify-content: center;
  }

  .typewriter-text {
    font-family: Georgia, serif;
    font-size: clamp(1.2rem, 3vw, 1.6rem);
    font-style: italic;
    font-weight: normal;
    color: rgba(255,255,255,0.85);
    letter-spacing: 0.03em;
    opacity: 0;
    animation: fadeUp 1s ease 0.6s forwards;
  }

  .cursor {
    display: inline-block;
    color: #A58BC4;
    font-weight: 300;
    animation: blink 1s step-end infinite;
  }

  @keyframes blink {
    0%, 100% { opacity: 1; }
    50% { opacity: 0; }
  }

  @keyframes fadeUp {
    from { opacity: 0; transform: translateY(20px); }
    to   { opacity: 1; transform: translateY(0); }
  }
</style>
</head>
<body>
<canvas id="c"></canvas>

<div class="content">
  <div class="logo">Tr&#228;ffas</div>
  <div class="typewriter-wrap">
    <span class="typewriter-text"><span id="tw"></span><span class="cursor">|</span></span>
  </div>
</div>

<script>
const SEQUENCES = [
  'K\u00e4rlek b\u00f6rjar med ett m\u00f6te',
  'En ny dejtingupplevelse \u00f6ppnar snart sina d\u00f6rrar.',
  '2026',
];
const CHAR_SPEED = 55;
const ERASE_SPEED = 30;
const PAUSE_AFTER = 3500;
const PAUSE_BETWEEN = 800;

const tw = document.getElementById('tw');
let seqIndex = 0;

function type(text, pos) {
  if (pos <= text.length) {
    tw.textContent = text.slice(0, pos);
    setTimeout(() => type(text, pos + 1), CHAR_SPEED);
  } else {
    setTimeout(() => erase(text, text.length), PAUSE_AFTER);
  }
}

function erase(text, pos) {
  if (pos >= 0) {
    tw.textContent = text.slice(0, pos);
    setTimeout(() => erase(text, pos - 1), ERASE_SPEED);
  } else {
    seqIndex = (seqIndex + 1) % SEQUENCES.length;
    setTimeout(() => type(SEQUENCES[seqIndex], 0), PAUSE_BETWEEN);
  }
}

setTimeout(() => type(SEQUENCES[0], 0), 1000);

const canvas = document.getElementById('c');
const ctx = canvas.getContext('2d');
let W, H, particles = [];

function resize() {
  W = canvas.width  = window.innerWidth;
  H = canvas.height = window.innerHeight;
}
resize();
window.addEventListener('resize', resize);

function randomHeart() {
  return {
    x: Math.random() * W,
    y: H + 20,
    size: 6 + Math.random() * 14,
    speed: 0.4 + Math.random() * 0.8,
    alpha: 0.1 + Math.random() * 0.35,
    drift: (Math.random() - 0.5) * 0.4,
    wobble: Math.random() * Math.PI * 2,
    wobbleSpeed: 0.01 + Math.random() * 0.02,
  };
}

for (let i = 0; i < 40; i++) {
  const p = randomHeart();
  p.y = Math.random() * H;
  particles.push(p);
}

function drawHeart(ctx, x, y, size, alpha) {
  ctx.save();
  ctx.globalAlpha = alpha;
  ctx.fillStyle = 'hsl(' + (265 + Math.random()*20) + ', 45%, 60%)';
  ctx.beginPath();
  const s = size * 0.5;
  ctx.moveTo(x, y + s * 0.5);
  ctx.bezierCurveTo(x, y, x - s, y, x - s, y - s * 0.5);
  ctx.bezierCurveTo(x - s, y - s * 1.2, x, y - s * 1.2, x, y - s * 0.5);
  ctx.bezierCurveTo(x, y - s * 1.2, x + s, y - s * 1.2, x + s, y - s * 0.5);
  ctx.bezierCurveTo(x + s, y, x, y, x, y + s * 0.5);
  ctx.fill();
  ctx.restore();
}

function animate() {
  ctx.clearRect(0, 0, W, H);
  for (let p of particles) {
    p.y -= p.speed;
    p.wobble += p.wobbleSpeed;
    p.x += p.drift + Math.sin(p.wobble) * 0.3;
    drawHeart(ctx, p.x, p.y, p.size, p.alpha);
    if (p.y < -30) Object.assign(p, randomHeart());
  }
  requestAnimationFrame(animate);
}
animate();
</script>
</body>
</html>
